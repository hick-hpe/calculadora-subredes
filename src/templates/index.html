<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de Sub-redes IPv4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- form -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-4">
                            Calculadora de Sub-redes IPv4
                        </h1>

                        <form action="/subredes" method="post">

                            <div class="mb-3">
                                <label for="endereco_ip" class="form-label">
                                    Endereço IP
                                </label>
                                <input type="text" class="form-control" id="endereco_ip" name="endereco_ip"
                                    placeholder="Ex: 192.168.1.1" required>
                            </div>

                            <div class="mb-4">
                                <label for="mascara" class="form-label">
                                    Máscara de Sub-rede
                                </label>
                                <input type="text" class="form-control" id="mascara" name="mascara"
                                    placeholder="Ex: 255.255.255.0 ou /24" required>
                            </div>

                            <div id="mensagem_erro" class="alert alert-danger py-2" role="alert" style="display: none;">
                            </div>

                            <button type="submit" id="btn_calcular" class="btn btn-primary w-100">
                                <span id="texto_botao">Calcular</span>

                                <span id="spinner" class="spinner-border spinner-border-sm ms-2" role="status"
                                    style="display: none;">
                                    <span class="visually-hidden">Carregando...</span>
                                </span>
                            </button>

                            <span id="spinner" class="spinner-border spinner-border-sm ms-2" role="status"
                                style="display: none;">
                                <span class="visually-hidden">Carregando...</span>
                            </span>

                        </form>
                    </div>
                </div>

                <!-- resultados -->
                <div id="resultados" class="card shadow-sm border-0 mt-4" style="display: none;">

                    <div class="card-body p-4">

                        <h2 class="h4 mb-4">Resultados</h2>

                        <h3 class="h6 text-primary">Informações do IP</h3>

                        <p>
                            <strong>Endereço IP binário:</strong>
                            <span id="endereco_ip_binario"></span>
                        </p>

                        <hr>

                        <h3 class="h6 text-primary">Máscara de sub-rede</h3>

                        <p>
                            <strong>Prefixo:</strong>
                            <span id="mascara_prefixo"></span>
                        </p>

                        <p>
                            <strong>Decimal:</strong>
                            <span id="mascara_decimal"></span>
                        </p>

                        <p>
                            <strong>Binário:</strong>
                            <span id="mascara_binario"></span>
                        </p>

                        <hr>

                        <h3 class="h6 text-primary">Endereçamento</h3>

                        <p>
                            <strong>Endereço de rede:</strong>
                            <span id="endereco_rede"></span>
                        </p>

                        <p>
                            <strong>Broadcast:</strong>
                            <span id="endereco_broadcast"></span>
                        </p>

                        <p>
                            <strong>Quantidade de hosts:</strong>
                            <span id="quantidade_hosts"></span>
                        </p>

                        <p class="mb-0">
                            <strong>Faixa de hosts:</strong>
                            <span id="faixa_hosts"></span>
                        </p>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
